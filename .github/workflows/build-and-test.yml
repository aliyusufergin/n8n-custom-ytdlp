name: Build and test

on:
  workflow_call:
    inputs:
      publish-candidate:
        description: Export tested OCI archives for the manual publishing workflow
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the publishing plan
        if: ${{ inputs.publish-candidate }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan

      - name: Set up Docker with the containerd image store
        if: ${{ inputs.publish-candidate }}
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: v29.8.0
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Set up Buildx for OCI export
        if: ${{ inputs.publish-candidate }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0

      - name: Build from the lock file and run the image suite
        id: test
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
          PUBLISH_CANDIDATE: ${{ inputs.publish-candidate }}
        # Explicit bash uses pipefail, so tee cannot hide a build or test failure.
        run: |
          args=()
          if [ "$PUBLISH_CANDIDATE" = true ]; then
            args+=(--plan "$RUNNER_TEMP/plan/plan.json" --archive "$RUNNER_TEMP/candidate/image.tar")
          fi
          python3 scripts/build_and_test.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/build-and-test.log"

      - name: Verify YouTube failure is warning-only
        id: youtube-warning
        env:
          PUBLISH_CANDIDATE: ${{ inputs.publish-candidate }}
        # Exercise a real network failure even if the live YouTube probe succeeded.
        # pipefail checks the suite's exit status; grep checks that it emitted a warning.
        run: |
          lock=build-inputs.lock.json
          if [ "$PUBLISH_CANDIDATE" = true ]; then
            lock="$RUNNER_TEMP/plan/candidate.lock.json"
          fi
          python3 tests/test_image.py n8n-ytdlp:local "$lock" \
            --youtube-network none ImageTests.test_youtube_download \
            2>&1 | tee "$RUNNER_TEMP/youtube-warning.log" \
            | tee -a "$RUNNER_TEMP/build-and-test.log"
          grep -F 'WARNING: YouTube download failed (non-blocking):' "$RUNNER_TEMP/youtube-warning.log"

      - name: Upload the tested OCI archive and identity receipt
        if: ${{ inputs.publish-candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Report build and test results
        if: ${{ always() && steps.test.outcome != 'skipped' }}
        env:
          ARCH: ${{ matrix.arch }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          WARNING_OUTCOME: ${{ steps.youtube-warning.outcome }}
        run: |
          {
            printf '## Image tests (%s): %s\n\n' "$ARCH" "$TEST_OUTCOME"
            printf 'YouTube warning-only verification: %s\n\n' "$WARNING_OUTCOME"
            printf 'Final build and test output, including suite warnings (last 60 KB). Full output is in the job log.\n\n'
            printf '~~~~text\n'
            tail -c 60000 "$RUNNER_TEMP/build-and-test.log"
            printf '\n~~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WARNING_OUTCOME" = success ]; then
            grep -F 'WARNING: YouTube download failed (non-blocking):' "$GITHUB_STEP_SUMMARY"
            printf 'Verified the YouTube failure warning in GITHUB_STEP_SUMMARY (%s).\n' "$ARCH"
          fi
