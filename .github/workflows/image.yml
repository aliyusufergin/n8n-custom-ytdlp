name: Image

on:
  pull_request:

permissions:
  contents: read

jobs:
  updater-tests:
    name: Offline updater tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the updater command
        run: python3 tests/test_updater.py

  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
