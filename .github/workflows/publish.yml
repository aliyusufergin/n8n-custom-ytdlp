name: Manual publish

# Attestations name this file's path and refs/heads/main. Renaming the file makes the
# README verification command reject every custom image attested before the rename.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    # Publishing and the workflow-token lock commit are restricted to main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the updater and create a manual plan
        id: plan
        shell: bash
        env:
          # The updater reads upstream GitHub releases with the read-only workflow token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tests/test_updater.py
          mkdir -p "$RUNNER_TEMP/plan"
          python3 scripts/updater.py --trigger manual > "$RUNNER_TEMP/plan/plan.json"
          python3 - "$RUNNER_TEMP/plan/plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          print(f'build={str(plan["build"]).lower()}')
          PY
      - name: Save the plan for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      publish-candidate: true

  publish:
    needs: [plan, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.published.outputs.image-digest }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's plan and tested archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ${{ runner.temp }}/publish
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify both images and every tag
        run: >-
          python3 scripts/publish.py
          --plan "$RUNNER_TEMP/publish/publish-plan/plan.json"
          --artifacts "$RUNNER_TEMP/publish"
          --result "$RUNNER_TEMP/published.lock.json"
      - name: Save the verified published lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-lock
          path: ${{ runner.temp }}/published.lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Expose the verified custom image index digest
        id: published
        run: >-
          python3 -c 'import json, sys; print("image-digest=" + json.load(open(sys.argv[1]))["published"]["image_digest"])'
          "$RUNNER_TEMP/published.lock.json" >> "$GITHUB_OUTPUT"

  attest:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can mint a GitHub OIDC token for Sigstore and write attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest the custom image index and push the attestation to Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/aliyusufergin/n8n-ytdlp
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  verify-attestation:
    needs: [publish, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the verified published lock
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Run the README verification command on the custom and upstream n8n images
        env:
          # gh requires a token even when it reads the attestation from Docker Hub.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          lock="$RUNNER_TEMP/result/published.lock.json"
          build_tag=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["published"]["build_tag"])' "$lock")
          upstream=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["n8n"]["image_digest"])' "$lock")
          verify() {
            gh attestation verify "oci://$1" \
              --repo aliyusufergin/n8n-custom-ytdlp \
              --signer-workflow aliyusufergin/n8n-custom-ytdlp/.github/workflows/publish.yml \
              --source-ref refs/heads/main \
              --bundle-from-oci
          }
          verify "docker.io/aliyusufergin/n8n-ytdlp:$build_tag"
          # The upstream n8n image cannot carry this workflow's attestation, so a pass means
          # the command verifies nothing. The summary shows why it was rejected.
          if rejection=$(verify "docker.io/n8nio/n8n@$upstream" 2>&1); then
            echo "::error::The upstream n8n image passed attestation verification"
            exit 1
          fi
          {
            printf 'The attestation of aliyusufergin/n8n-ytdlp:%s verified from Docker Hub.\n\n' "$build_tag"
            printf 'The same command rejected the upstream n8n image n8nio/n8n@%s:\n\n' "$upstream"
            printf '~~~~text\n%s\n~~~~\n' "$rejection"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    needs: publish
    name: Verify published image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the image acceptance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified published lock
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Anonymously pull, verify tags, and run the image suite
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish import CUSTOM, RUNNERS, verify_remote
          lock_path = Path(os.environ['RUNNER_TEMP']) / 'result/published.lock.json'
          lock = json.loads(lock_path.read_text())
          major, minor, patch = lock['n8n']['version'].split('.')
          tags = [major, f'{major}.{minor}', f'{major}.{minor}.{patch}', lock['published']['build_tag']]
          for tag in tags:
              verify_remote(f'{CUSTOM}:{tag}', lock['published']['image_digest'])
              verify_remote(f'{RUNNERS}:{tag}', lock['n8n']['runners_digest'])
          image = f'{CUSTOM}:{major}'
          for reference in (image, f'n8nio/n8n@{lock["n8n"]["image_digest"]}'):
              subprocess.run(['docker', 'pull', '--platform', f'linux/{os.environ["ARCH"]}', reference], check=True)
          subprocess.run([sys.executable, 'tests/test_image.py', image, str(lock_path),
                          '--build-tag', lock['published']['build_tag']], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published {image} passed all image tests on {os.environ["ARCH"]}.\n\n')
              summary.write(f'All custom and runners tags match the published lock: {tags}\n')
          PY

  scan:
    needs: publish
    name: Vulnerability report (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Report only: neither findings nor scanner errors fail the run, and the lock commit does not wait.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the published custom image
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # The registry source picks this runner's platform from the published index.
          image: registry:docker.io/aliyusufergin/n8n-ytdlp@${{ needs.publish.outputs.image-digest }}
          grype-version: v0.119.0
          fail-build: false
          output-format: json
          output-file: ${{ runner.temp }}/vulnerabilities.json
      - name: Write the findings to the run summary
        if: ${{ always() }}
        env:
          ARCH: ${{ matrix.arch }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: >-
          python3 scripts/vulnerability_report.py
          --arch "$ARCH"
          --report "$RUNNER_TEMP/vulnerabilities.json"
          --scan-outcome "$SCAN_OUTCOME"
          >> "$GITHUB_STEP_SUMMARY"

  commit-lock:
    needs: [publish, attest, verify-attestation, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the verified automation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - name: Check out current main for the lock commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
      - name: Download the plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan
      - name: Download the verified published lock
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Commit on current main and push without force
        run: >-
          python3 automation/scripts/commit_lock.py
          --repository current
          --plan "$RUNNER_TEMP/plan/plan.json"
          --previous-lock automation/build-inputs.lock.json
          --result "$RUNNER_TEMP/result/published.lock.json"

  notify:
    # The report-only scan stays out: its findings and errors never fail a run.
    needs: [plan, build-and-test, publish, attest, verify-attestation, verify-published, commit-lock]
    # Every finished run on main reports; a cancelled run and pull requests never touch issues.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the plan
        if: ${{ needs.plan.result == 'success' }}
        # A re-run after the plan expired must still report the run, just without notices.
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan
      - name: Open, update or close the failure issue and raise the plan's notices
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/plan/plan.json" ]; then
            args+=(--plan "$RUNNER_TEMP/plan/plan.json")
          fi
          python3 scripts/notify.py --run-url "$RUN_URL" --needs "$NEEDS" "${args[@]}"
