name: Publish

# Attestations name this file's path and refs/heads/main. Renaming the file makes the
# README verification command reject every custom image attested before the rename.

on:
  schedule:
    # Off the top of the hour, when GitHub delays and drops scheduled runs.
    - cron: '17 */6 * * *'
    # Only re-enables this workflow. Jobs recognise it by this exact string.
    - cron: '43 4 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    # A push that changes only these files does not publish. Lock commits made with the
    # workflow token never start a run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false
  # Keep every waiting run: by default a newer run cancels the waiting one, which could
  # drop a push that must publish.
  queue: max

jobs:
  plan:
    # Publishing and the workflow-token lock commit are restricted to main.
    if: ${{ github.ref == 'refs/heads/main' && github.event.schedule != '43 4 1 * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build-ai: ${{ steps.plan.outputs.build-ai }}
      ai-error: ${{ steps.plan.outputs.ai-error }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the lock file of current main
        # A queued run's revision can predate the lock commit of the run before it, so
        # planning against that revision's lock would publish the same build inputs again.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
          persist-credentials: false
          sparse-checkout: /build-inputs.lock.json
          sparse-checkout-cone-mode: false
      - name: Test the updater and create the plan
        id: plan
        shell: bash
        env:
          # The updater reads upstream GitHub releases with the read-only workflow token.
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
        run: |
          python3 tests/test_updater.py
          mkdir -p "$RUNNER_TEMP/plan"
          lock=current/build-inputs.lock.json
          # The lock commit checks that main's build inputs still match this previous lock.
          if [ -f "$lock" ]; then
            cp "$lock" "$RUNNER_TEMP/plan/previous.lock.json"
          fi
          python3 scripts/updater.py --lock "$lock" --trigger "$TRIGGER" > "$RUNNER_TEMP/plan/plan.json"
          python3 - "$RUNNER_TEMP/plan/plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          print(f'build={str(plan["build"]).lower()}')
          print(f'build-ai={str(plan["ai_variant"]["build"]).lower()}')
          print('ai-error=' + (plan["ai_variant"]["error"] or "").replace("\n", " "))
          PY
      - name: Save the plan and the previous lock for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan/
          if-no-files-found: error
          retention-days: 1

  build-and-test:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      publish-candidate: true

  # An AI tool's upstream error fails only this job, so the failure issue opens while the
  # custom image publishes as usual.
  ai-upstream:
    needs: plan
    if: ${{ needs.plan.outputs.ai-error != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail with the AI tool's upstream error
        env:
          AI_ERROR: ${{ needs.plan.outputs.ai-error }}
        run: |
          echo "::error::The AI variant cannot be planned: $AI_ERROR"
          exit 1

  # The AI variant's chain mirrors the custom image's and never blocks it.
  build-and-test-ai:
    needs: plan
    if: ${{ needs.plan.outputs.build-ai == 'true' }}
    uses: ./.github/workflows/build-and-test.yml
    with:
      publish-candidate: true
      variant: ai

  publish-ai:
    needs: [plan, build-and-test-ai]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.published.outputs.image-digest }}
      build-tag: ${{ steps.published.outputs.build-tag }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's plan and tested archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ${{ runner.temp }}/publish
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify the AI variant and every tag
        run: >-
          python3 scripts/publish.py --variant ai
          --plan "$RUNNER_TEMP/publish/publish-plan/plan.json"
          --artifacts "$RUNNER_TEMP/publish"
          --result "$RUNNER_TEMP/ai-published.json"
      - name: Save the verified AI variant result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-published
          path: ${{ runner.temp }}/ai-published.json
          if-no-files-found: error
          retention-days: 1
      - name: Expose the verified AI variant index digest and build tag
        id: published
        run: >-
          python3 -c 'import json, sys; state = json.load(open(sys.argv[1]))["published_ai_variant"];
          print("image-digest=" + state["image_digest"]); print("build-tag=" + state["build_tag"])'
          "$RUNNER_TEMP/ai-published.json" >> "$GITHUB_OUTPUT"

  attest-ai:
    needs: publish-ai
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest the AI variant index and push the attestation to Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/aliyusufergin/n8n-ytdlp-ai
          subject-digest: ${{ needs.publish-ai.outputs.image-digest }}
          push-to-registry: true
          create-storage-record: false

  verify-attestation-ai:
    needs: [publish-ai, attest-ai]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run the README verification command on the AI variant
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.publish-ai.outputs.build-tag }}
        run: |
          gh attestation verify "oci://docker.io/aliyusufergin/n8n-ytdlp-ai:$BUILD_TAG" \
            --repo aliyusufergin/n8n-custom-ytdlp \
            --signer-workflow aliyusufergin/n8n-custom-ytdlp/.github/workflows/publish.yml \
            --source-ref refs/heads/main \
            --bundle-from-oci
          printf 'The attestation of aliyusufergin/n8n-ytdlp-ai:%s verified from Docker Hub.\n' "$BUILD_TAG" \
            >> "$GITHUB_STEP_SUMMARY"

  verify-published-ai:
    needs: publish-ai
    name: Verify published AI variant (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the image acceptance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified AI variant result
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ai-published
          path: ${{ runner.temp }}/result
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Anonymously pull, verify tags, and run the AI variant suite
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish import AI_VARIANT, verify_remote
          result_path = Path(os.environ['RUNNER_TEMP']) / 'result/ai-published.json'
          state = json.loads(result_path.read_text())['published_ai_variant']
          major, minor, patch = state['build_inputs']['n8n']['version'].split('.')
          tags = [major, f'{major}.{minor}', f'{major}.{minor}.{patch}', state['build_tag']]
          for tag in tags:
              verify_remote(f'{AI_VARIANT}:{tag}', state['image_digest'])
          image = f'{AI_VARIANT}:{major}'
          for reference in (image, f'n8nio/n8n@{state["build_inputs"]["n8n"]["image_digest"]}'):
              subprocess.run(['docker', 'pull', '--platform', f'linux/{os.environ["ARCH"]}', reference], check=True)
          subprocess.run([sys.executable, 'tests/test_image.py', image, str(result_path),
                          '--variant', 'ai', '--build-tag', state['build_tag']], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published {image} passed all AI variant tests on {os.environ["ARCH"]}.\n\n')
              summary.write(f'All AI variant tags match the published result: {tags}\n')
          PY

  publish:
    needs: [plan, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.published.outputs.image-digest }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's plan and tested archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: ${{ runner.temp }}/publish
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish and verify both images and every tag
        run: >-
          python3 scripts/publish.py
          --plan "$RUNNER_TEMP/publish/publish-plan/plan.json"
          --artifacts "$RUNNER_TEMP/publish"
          --result "$RUNNER_TEMP/published.lock.json"
      - name: Save the verified published lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-lock
          path: ${{ runner.temp }}/published.lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Expose the verified custom image index digest
        id: published
        run: >-
          python3 -c 'import json, sys; print("image-digest=" + json.load(open(sys.argv[1]))["published"]["image_digest"])'
          "$RUNNER_TEMP/published.lock.json" >> "$GITHUB_OUTPUT"

  attest:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can mint a GitHub OIDC token for Sigstore and write attestations.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Attest the custom image index and push the attestation to Docker Hub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/aliyusufergin/n8n-ytdlp
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  verify-attestation:
    needs: [publish, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the verified published lock
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Run the README verification command on the custom and upstream n8n images
        env:
          # gh requires a token even when it reads the attestation from Docker Hub.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          lock="$RUNNER_TEMP/result/published.lock.json"
          build_tag=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["published"]["build_tag"])' "$lock")
          upstream=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["n8n"]["image_digest"])' "$lock")
          verify() {
            gh attestation verify "oci://$1" \
              --repo aliyusufergin/n8n-custom-ytdlp \
              --signer-workflow aliyusufergin/n8n-custom-ytdlp/.github/workflows/publish.yml \
              --source-ref refs/heads/main \
              --bundle-from-oci
          }
          verify "docker.io/aliyusufergin/n8n-ytdlp:$build_tag"
          # The upstream n8n image cannot carry this workflow's attestation, so a pass means
          # the command verifies nothing. The summary shows why it was rejected.
          if rejection=$(verify "docker.io/n8nio/n8n@$upstream" 2>&1); then
            echo "::error::The upstream n8n image passed attestation verification"
            exit 1
          fi
          {
            printf 'The attestation of aliyusufergin/n8n-ytdlp:%s verified from Docker Hub.\n\n' "$build_tag"
            printf 'The same command rejected the upstream n8n image n8nio/n8n@%s:\n\n' "$upstream"
            printf '~~~~text\n%s\n~~~~\n' "$rejection"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    needs: publish
    name: Verify published image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the image acceptance suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified published lock
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Install the registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Anonymously pull, verify tags, and run the image suite
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish import CUSTOM, RUNNERS, verify_remote
          lock_path = Path(os.environ['RUNNER_TEMP']) / 'result/published.lock.json'
          lock = json.loads(lock_path.read_text())
          major, minor, patch = lock['n8n']['version'].split('.')
          tags = [major, f'{major}.{minor}', f'{major}.{minor}.{patch}', lock['published']['build_tag']]
          for tag in tags:
              verify_remote(f'{CUSTOM}:{tag}', lock['published']['image_digest'])
              verify_remote(f'{RUNNERS}:{tag}', lock['n8n']['runners_digest'])
          image = f'{CUSTOM}:{major}'
          for reference in (image, f'n8nio/n8n@{lock["n8n"]["image_digest"]}'):
              subprocess.run(['docker', 'pull', '--platform', f'linux/{os.environ["ARCH"]}', reference], check=True)
          subprocess.run([sys.executable, 'tests/test_image.py', image, str(lock_path),
                          '--build-tag', lock['published']['build_tag']], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published {image} passed all image tests on {os.environ["ARCH"]}.\n\n')
              summary.write(f'All custom and runners tags match the published lock: {tags}\n')
          PY

  scan:
    needs: publish
    name: Vulnerability report (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Report only: neither findings nor scanner errors fail the run, and the lock commit does not wait.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the published custom image
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          # The registry source picks this runner's platform from the published index.
          image: registry:docker.io/aliyusufergin/n8n-ytdlp@${{ needs.publish.outputs.image-digest }}
          grype-version: v0.119.0
          fail-build: false
          output-format: json
          output-file: ${{ runner.temp }}/vulnerabilities.json
      - name: Write the findings to the run summary
        if: ${{ always() }}
        env:
          ARCH: ${{ matrix.arch }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: >-
          python3 scripts/vulnerability_report.py
          --arch "$ARCH"
          --report "$RUNNER_TEMP/vulnerabilities.json"
          --scan-outcome "$SCAN_OUTCOME"
          >> "$GITHUB_STEP_SUMMARY"

  commit-lock:
    needs: [publish, attest, verify-attestation, verify-published,
            publish-ai, attest-ai, verify-attestation-ai, verify-published-ai]
    # Each image's lock keys move only after that image's whole chain succeeded.
    if: >-
      ${{ !cancelled() && (
      (needs.publish.result == 'success' && needs.attest.result == 'success'
      && needs.verify-attestation.result == 'success' && needs.verify-published.result == 'success')
      || (needs.publish-ai.result == 'success' && needs.attest-ai.result == 'success'
      && needs.verify-attestation-ai.result == 'success' && needs.verify-published-ai.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CUSTOM_OK: >-
        ${{ needs.publish.result == 'success' && needs.attest.result == 'success'
        && needs.verify-attestation.result == 'success' && needs.verify-published.result == 'success' }}
      AI_OK: >-
        ${{ needs.publish-ai.result == 'success' && needs.attest-ai.result == 'success'
        && needs.verify-attestation-ai.result == 'success' && needs.verify-published-ai.result == 'success' }}
    steps:
      - name: Check out the verified automation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - name: Check out current main for the lock commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: current
      - name: Download the plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan
      - name: Download the verified published lock
        if: ${{ env.CUSTOM_OK == 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: published-lock
          path: ${{ runner.temp }}/result
      - name: Download the verified AI variant result
        if: ${{ env.AI_OK == 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ai-published
          path: ${{ runner.temp }}/result
      - name: Commit on current main and push without force
        shell: bash
        run: |
          args=()
          if [ "$CUSTOM_OK" = true ]; then
            args+=(--result "$RUNNER_TEMP/result/published.lock.json")
          fi
          if [ "$AI_OK" = true ]; then
            args+=(--ai-result "$RUNNER_TEMP/result/ai-published.json")
          fi
          python3 automation/scripts/commit_lock.py \
            --repository current \
            --plan "$RUNNER_TEMP/plan/plan.json" \
            --previous-lock "$RUNNER_TEMP/plan/previous.lock.json" \
            "${args[@]}"

  notify:
    # The report-only scan stays out: its findings and errors never fail a run.
    needs: [plan, build-and-test, publish, attest, verify-attestation, verify-published,
            ai-upstream, build-and-test-ai, publish-ai, attest-ai, verify-attestation-ai,
            verify-published-ai, commit-lock]
    # Every finished publishing run on main reports; a cancelled run, pull requests and the
    # monthly re-enable never touch issues.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && github.event.schedule != '43 4 1 * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the plan
        if: ${{ needs.plan.result == 'success' }}
        # A re-run after the plan expired must still report the run, just without notices.
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: publish-plan
          path: ${{ runner.temp }}/plan
      - name: Open, update or close the failure issue and raise the plan's notices
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/plan/plan.json" ]; then
            args+=(--plan "$RUNNER_TEMP/plan/plan.json")
          fi
          python3 scripts/notify.py --run-url "$RUN_URL" --needs "$NEEDS" "${args[@]}"

  re-enable:
    # GitHub disables scheduled workflows in public repositories after 60 days without
    # repository activity, and does not say whether workflow-token lock commits count.
    if: ${{ github.event.schedule == '43 4 1 * *' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Mark this workflow enabled through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method PUT "repos/$REPOSITORY/actions/workflows/publish.yml/enable"
